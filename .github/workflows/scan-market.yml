name: Escanear mercado

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ejecutar escaneo
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: node scripts/scan-market.mjs
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ results.json
          git diff --cached --quiet || git commit -m "Actualizar datos del escáner"
          git push
